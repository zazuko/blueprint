<div class="row">
    @for(p of nodeElements(); track p.iri ){
    <div style="position: relative;" [ngClass]="highlightedIri() === p.iri ? 'highlight' : ''">
        <div style="position:absolute; right: 4px; top: 4px; z-index: 10;">
            <button mat-icon-button (click)="forceHighlight(p.iri)" aria-label="Highlight node">
                <i class="fas fa-sun" [class.text-blue-500]="forcedHighlightIri() === p.iri" [class.text-zinc-400]="forcedHighlightIri() !== p.iri"></i>
            </button>
        </div>

        <bp-hierarchy-card (click)="emitNodeSelected(p)" (mouseenter)="setHoveredIri(p.iri) "
            (mouseleave)="setHoveredIri()" [avatars]="p.avatars" [firstLine]="p.label"
            [secondLine]="p.classLabel.join(', ')" />
    </div>
    }
</div>
