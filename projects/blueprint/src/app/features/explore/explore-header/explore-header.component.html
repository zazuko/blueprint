<div style="display: flex; flex-direction: row; align-items: center; gap: 12px; width: 100%">
    @if(isLoading()) {
    <div class="w-[64px] h-[64px] rounded-full bg-zinc-200 dark:bg-zinc-800 animate-pulse mr-2"></div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
        <div class="h-4 w-40 bg-zinc-200 dark:bg-zinc-800 animate-pulse rounded mb-2"></div>
        <div class="h-4 w-96 bg-zinc-200 dark:bg-zinc-800 animate-pulse rounded mb-2"></div>
    </div>

    }@else {
    <bp-avatar [avatars]="avatars()" @fadeIn />

    <div @fadeIn>
        <p>
            @if (subjectClassLabel().length === 0) {
            &nbsp;
            } @else {
            <span>{{subjectClassLabel()}}</span>
            }
        </p>
        <h1 class="title">{{subjectLabel()}}</h1>
    </div>
    }
    <div style="flex-grow: 1;">

    </div>
    <div>
        <mat-menu #menu="matMenu">
            @for (item of items(); track item.label) {
                @if (item.url) {
                <a mat-menu-item [href]="item.url" target="_blank">
                    <i [class]="item.icon" class="mr-2"></i>
                    <span>{{ item.label }}</span>
                </a>
                } @else {
                <button mat-menu-item (click)="item.command()">
                    <i [class]="item.icon" class="mr-2"></i>
                    <span>{{ item.label }}</span>
                </button>
                }
            }
        </mat-menu>
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="More actions" class="border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950">
            <i class="fas fa-ellipsis-v"></i>
        </button>
    </div>

</div>
